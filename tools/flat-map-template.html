<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LandLord — the flat proving frame</title>
<style>
  html,body{margin:0;padding:0;background:#1E1108;height:100%;}
  body{display:flex;align-items:center;justify-content:center;}
  svg.frame{display:block;width:100vw;height:100vh;max-width:100%;}
  .door,.knight{cursor:pointer;outline:none;}
  .door .ring,.door .ring2,.knight .ring,.knight .ring2{opacity:0;transition:opacity .12s ease;}
  .door:hover .ring,.knight:hover .ring{opacity:.75;}
  .door:hover .ring2,.knight:hover .ring2{opacity:.5;}
  .door:focus-visible .ring,.knight:focus-visible .ring{opacity:1;}
  .door:focus-visible .ring2,.knight:focus-visible .ring2{opacity:1;}
  .st-held  {--w1:#EADFC6;--w2:#CBBFA3;--r1:#7A5233;--r2:#46301E;--dk:#33200F;}
  .st-bare  {--w1:#79705F;--w2:#5A5142;--r1:#4A3826;--r2:#2E2013;--dk:#26190C;}
  .st-vacant{--w1:#B3B2A4;--w2:#8F9083;--r1:#5B4E3D;--r2:#352A1D;--dk:#26344C;--shut:1;}
  .st-crisis{--w1:#EADFC6;--w2:#CBBFA3;--r1:#7A5233;--r2:#46301E;--dk:#33200F;--flag:1;}

  /* THE INSPECTOR — design law 6 and the A/E/P check, drawn: the act stands
     beside the record it changes. A surface that reports a state and makes you
     navigate elsewhere to change it has failed, and that failure has shipped
     here more than once. Copy sits on a clean field, never on the wood
     (WRIT §10.5 — text on wood grain is where fantasy UIs die). */
  .inspector{position:fixed;top:22px;right:22px;width:280px;
    background:#171D2C;border:1px solid #3A2A10;border-radius:7px;
    box-shadow:0 14px 34px rgba(0,0,0,.55);color:#EADFC6;
    font:13px/1.45 ui-sans-serif,system-ui,sans-serif;overflow:hidden;
    opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .12s,transform .12s}
  .inspector[data-open]{opacity:1;transform:none;pointer-events:auto}
  .inspector h2{margin:0;padding:11px 13px 3px;font-size:14px;font-weight:600;letter-spacing:.1px}
  .inspector .kind{padding:0 13px 10px;font-size:10.5px;letter-spacing:.14em;
    text-transform:uppercase;color:#8A6323}
  .inspector dl{margin:0;padding:9px 13px;display:grid;grid-template-columns:auto 1fr;
    gap:5px 12px;border-top:1px solid #22304A}
  .inspector dt{color:#8F9083;font-size:11.5px}
  .inspector dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
  .inspector .acts{display:flex;flex-direction:column;gap:6px;padding:11px 13px 13px;
    border-top:1px solid #22304A;background:#131A28}
  .inspector button{font:inherit;font-size:12.5px;padding:7px 10px;border-radius:5px;
    border:1px solid #3A2A10;background:#22304A;color:#EADFC6;cursor:pointer;text-align:left}
  .inspector button:hover{background:#2B3C5C}
  .inspector button:focus-visible{outline:2px solid #F3EDDC;outline-offset:1px}
  .inspector button.alarm{background:#5A2118;border-color:#7A2E22}
  .inspector .none{color:#8F9083;font-size:11.5px;padding:2px 0 0}
  .inspector .close{position:absolute;top:8px;right:9px;background:none;border:0;
    color:#8F9083;font-size:15px;line-height:1;padding:3px 5px;cursor:pointer}

  /* Only the BUILDING is a hit target. Its shadow is a wide filled ellipse and
     its focus rings are strokes — all three capture clicks by default, so
     aiming at a house could select the neighbour whose shadow you actually hit.
     Found by clicking a door in crisis and having the panel open on a held one. */
  .door .ring, .door .ring2 {pointer-events:none}
</style>
</head>
<body>
<aside class="inspector" id="inspector" role="region" aria-live="polite" aria-label="The selected holding">
  <button class="close" id="insp-close" aria-label="Close">×</button>
  <h2 id="insp-name">—</h2>
  <div class="kind" id="insp-kind"></div>
  <dl>
    <dt>Standing</dt><dd id="insp-state">—</dd>
    <dt>Fellowship</dt><dd id="insp-block">—</dd>
    <dt>Parcel</dt><dd id="insp-parcel">—</dd>
  </dl>
  <div class="acts" id="insp-acts"></div>
</aside>
<svg class="frame" viewBox="0 0 1600 1000" role="group" aria-label="The war table: an illustrated estate map of two hundred and three doors, five rivers, five knights, and the week clock set into the table rim.">
<defs>

<!-- ================= the vignette ================= -->
<rect width="1600" height="1000" fill="url(#vig)" pointer-events="none"/>

<script>
const NS='http://www.w3.org/2000/svg';
// [x, y, kind, state, size, lean, street, tone] — baked from public/table-scene.json
const DOORS=@@DOORS@@;
const PARCELS=@@PARCELS_JS@@;
// [x, y, name, lean]
const KNIGHTS=@@KNIGHTS@@;

const KIND={c:['#g-c',13],h:['#g-h',14],w:['#g-w',18]};
function el(name,attrs){const e=document.createElementNS(NS,name);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}
// the doors' real y extent, so the depth gradient is spent where pieces are
const DY0=Math.min(...DOORS.map(d=>d[1]));
const DYS=Math.max(1,Math.max(...DOORS.map(d=>d[1]))-DY0);
// ── The inspector ─────────────────────────────────────────────────────────
// Selecting a holding shows its record AND the acts available on it, on one
// surface. The acts offered are a function of the STANDING — a bare door is
// offered a knight, a door in crisis is offered the thing that ends the crisis
// — so the panel never shows a control that would do nothing, which is the
// dead-button fault the A/E/P check exists to catch.
const ACTS={
  held:   [['Look at the door','']],
  bare:   [['Set a knight over it','']],
  vacant: [['Begin the make-ready turn','']],
  crisis: [['Answer the crisis','alarm'],['Set a knight over it','']],
  fallen: [['Raise the fallen holding','alarm']],
};
const STANDING={held:'held and quiet',bare:'in no knight\u2019s care',vacant:'standing empty',
  crisis:'in crisis',fallen:'fallen'};
const insp=document.getElementById('inspector');
function showDoor(d){
  const [x,y,k,st,sz,lean,street]=d.row;
  document.getElementById('insp-name').textContent=street;
  document.getElementById('insp-kind').textContent=({c:'cottage',h:'house',w:'wide holding'})[k]||k;
  document.getElementById('insp-state').textContent=STANDING[st]||st;
  document.getElementById('insp-block').textContent=d.parcel&&d.parcel.block>=0?('the '+ORD[d.parcel.block%ORD.length]+' fellowship'):'holds alone';
  document.getElementById('insp-parcel').textContent=d.parcel?(d.parcel.block>=0?('col '+(d.parcel.col+1)+' \u00b7 row '+(d.parcel.row+1)):'\u2014'):'\u2014';
  const acts=document.getElementById('insp-acts');
  acts.textContent='';
  for(const [label,cls] of (ACTS[st]||[])){
    const b=document.createElement('button');
    b.textContent=label; if(cls)b.className=cls;
    b.addEventListener('click',()=>{b.textContent=label+' \u2014 proposed, awaiting the Regent';b.disabled=true;});
    acts.appendChild(b);
  }
  insp.setAttribute('data-open','');
}
const ORD=['first','second','third','fourth','fifth','sixth','seventh','eighth','ninth','tenth',
  'eleventh','twelfth','thirteenth','fourteenth','fifteenth','sixteenth'];
document.getElementById('insp-close').addEventListener('click',()=>insp.removeAttribute('data-open'));

const doorsG=document.getElementById('doors');
const frag=document.createDocumentFragment();
let i=-1;
for(const [x,y,k,st,sz,lean,street] of DOORS){
  i++;
  const fallen=st==='fallen';
  const ref=fallen?'#g-f':KIND[k][0];
  const rr=fallen?21:KIND[k][1];
  // DEPTH. The board is a receding surface but every piece used to be stamped
  // at one size, which is the loudest "assembled rather than drawn" tell. North
  // (small y) is the far edge, so a piece grows as it comes forward.
  //
  // Normalised over the doors' ACTUAL y-range, not over the 0..1000 map: the
  // holdings occupy about the middle two thirds, so a gradient spread across
  // the whole map spent most of its range on empty ground and moved a piece by
  // less than a pixel. Measured at ±11% it changed nothing at all; at ±22% over
  // the real range it reads.
  const depth=0.78+0.44*((y-DY0)/DYS);
  const g=el('g',{class:'door st-'+st,tabindex:'0',role:'button',
    'aria-label':street+' — '+st,
    transform:'translate('+x+' '+y+') rotate('+(lean*140).toFixed(1)+') scale('+((0.55+sz*0.75)*(fallen?1.3:1)*depth).toFixed(3)+')'});
  const t=document.createElementNS(NS,'title');t.textContent=street+' — '+st;g.appendChild(t);
  // Every row that NAMES a thing is a door to that thing (A/E/P, accessibility):
  // pointer AND keyboard reach the same surface.
  const rec={row:[x,y,k,st,sz,lean,street],parcel:PARCELS[i]||null};
  g.addEventListener('click',()=>showDoor(rec));
  g.addEventListener('focus',()=>showDoor(rec));
  g.addEventListener('keydown',(e)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showDoor(rec);}});
  // The ring sits on the PIECE, not on the ground under it: the glyph is drawn
  // upward from its base, so a ring centred at the origin left the roof outside
  // it and the bottom third over bare grass. And it is no longer gold — gold
  // was doing the border, the flags and the clock as well, so "gold means
  // selected" carried no information at all.
  const cy=fallen?-6:-rr*0.52;
  g.appendChild(el('ellipse',{class:'ring2',cx:0,cy:cy,rx:rr+2,ry:(rr+2)*0.82,fill:'none',stroke:'#141A24','stroke-width':'4.5'}));
  g.appendChild(el('ellipse',{class:'ring',cx:0,cy:cy,rx:rr+2,ry:(rr+2)*0.82,fill:'none',stroke:'#F3EDDC','stroke-width':'2.2'}));
  g.appendChild(el('use',{href:ref}));
  frag.appendChild(g);
}
doorsG.appendChild(frag);
const knightsG=document.getElementById('knights');
for(const [x,y,name,lean] of KNIGHTS){
  const g=el('g',{class:'knight',tabindex:'0',role:'img',
    'aria-label':name+' — knight banner',
    transform:'translate('+x+' '+y+') rotate('+(lean*120).toFixed(1)+')'});
  const t=document.createElementNS(NS,'title');t.textContent=name;g.appendChild(t);
  g.appendChild(el('circle',{class:'ring2',cy:-14,r:26,fill:'none',stroke:'#171D2C','stroke-width':'4'}));
  g.appendChild(el('circle',{class:'ring',cy:-14,r:26,fill:'none',stroke:'#F0D68C','stroke-width':'2.2'}));
  g.appendChild(el('use',{href:'#g-k'}));
  knightsG.appendChild(g);
}
// the week dial: seven marks, no letters — the day is told by the raised pip and the hand
const dial=document.getElementById('clockDial');
const flute=document.getElementById('clockFlute');
const rivets=document.getElementById('clockRivets');
const DAY=2; // which of the seven the hand rests on
// fluted bezel
for(let i=0;i<72;i++){
  const a=i*5*Math.PI/180, c=Math.cos(a), s=Math.sin(a);
  flute.appendChild(el('line',{x1:c*262,y1:s*262,x2:c*288,y2:s*288,stroke:'#5E4415','stroke-width':'2.4',opacity:'0.3'}));
  const a2=a+2.5*Math.PI/180, c2=Math.cos(a2), s2=Math.sin(a2);
  flute.appendChild(el('line',{x1:c2*262,y1:s2*262,x2:c2*288,y2:s2*288,stroke:'#F0D68C','stroke-width':'1.2',opacity:'0.14'}));
}
// seven days
for(let i=0;i<7;i++){
  const a=(-90+i*(360/7))*Math.PI/180;
  const c=Math.cos(a),s=Math.sin(a);
  dial.appendChild(el('line',{x1:c*115,y1:s*115,x2:c*208,y2:s*208,stroke:'#5E4415','stroke-width':'3',opacity:'0.6'}));
  const cur=i===DAY;
  dial.appendChild(el('circle',{cx:c*178,cy:s*178,r:cur?18:13,fill:'#5E4415',opacity:'0.55'}));
  dial.appendChild(el('circle',{cx:c*178,cy:s*178,r:cur?14:10,
    fill:cur?'url(#bezelBrass)':'#6B4C18',stroke:cur?'#5E4415':'#3A2A10','stroke-width':cur?'2.2':'1.6'}));
  if(cur){dial.appendChild(el('circle',{cx:c*178,cy:s*178,r:21,fill:'none',stroke:'#F0D68C','stroke-width':'1.4',opacity:'0.5'}));dial.appendChild(el('circle',{cx:c*178-4,cy:s*178-4,r:3.5,fill:'#F6E2A0',opacity:'0.8'}));}
}
// the hand
{
  const a=DAY*(360/7);
  dial.appendChild(el('path',{d:'M -7.5 16 L -2.2 -152 L 0 -176 L 2.2 -152 L 7.5 16 L 0 30 Z',
    fill:'#3A2A10',stroke:'#E5C069','stroke-width':'1.1',transform:'rotate('+a+')'}));
}
// four rivets on the bezel
for(const deg of [-72,-24,24,72]){
  const a=(deg-90)*Math.PI/180;
  rivets.appendChild(el('circle',{cx:Math.cos(a)*274,cy:Math.sin(a)*274,r:8,
    fill:'url(#bezelBrass)',stroke:'#3A2A10','stroke-width':'1.4'}));
}
</script>
</svg>
</body>
